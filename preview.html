<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OE5XRX Logo – WIP-Vorschau</title>
<style>
  :root{ --marine:#123B54; --cyan:#3AC6D6; --light:#F4F7F9; --dark:#0A1219; }
  *{box-sizing:border-box}
  body{margin:0;font:16px/1.5 system-ui,sans-serif;background:#8a8f94;color:#111;padding:24px}
  h1{font-size:1.2rem;margin:0 0 4px}
  p.sub{margin:0 0 24px;color:#20242a}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;max-width:1000px}
  .card{border-radius:12px;padding:24px;display:flex;flex-direction:column;align-items:center;gap:12px}
  .card small{font:12px/1.4 ui-monospace,monospace;opacity:.8}
  .on-light{background:var(--light);color:var(--marine)}
  .on-dark{background:var(--dark);color:var(--cyan)}
  .appicon{background:var(--marine);color:var(--light);border-radius:22%}
  .sizes{background:var(--light);color:var(--marine);grid-column:1/-1;flex-direction:row;flex-wrap:wrap;justify-content:center;gap:28px}
  .sizes .lbl{display:flex;flex-direction:column;align-items:center;gap:6px}
  svg{display:block}
</style>
</head>
<body>
